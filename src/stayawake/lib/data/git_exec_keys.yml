# Configuration keys whose value git executes, or which change what git executes.
#
#   key               the key as `git config --list` prints it, lowercased; `*` matches any text
#   runs              how the value is run (OPTIONAL, default `command`):
#                       command            the value is a command line
#                       after-bang         only a value starting with `!` is a command line
#                       unless-boolean     a boolean value is a toggle, anything else a command line
#                       hooks-directory    the value names the directory hooks run from
#                       ext-transport      the subsection after `ext::` is a command line
#                       ext-address        a value starting `ext::` is a command line
#                       enables-transport  the value switches a command-running transport on
#                       absolute-path      a value that is an absolute path is a program
#   bang              a leading `!` is shell syntax to strip before reading the command (OPTIONAL)
#   driver            the attribute that must select this entry before it runs:
#                     filter | diff | merge (OPTIONAL)
#   fires_on_its_own  git runs it during ordinary operations nobody asked it to run (OPTIONAL)
#   override          how `saw govern classify` keeps a folder's own value from running, whatever
#                     the value is (OPTIONAL; without it the key is set again, to the operator's own
#                     value or to one that runs nothing):
#                       setting, value      set this other key instead; `{subsection}` is this key's
#                       environment, value  set this environment variable instead
#                       reset               the key adds to a list that this key set empty clears:
#                                           clear it, then add back the operator's own entries
#                       refuse              it cannot be kept from running: a folder that sets it
#                                           is not vouched for
#
# `always_set` lists settings every command saw does not check runs with, each with why.
#
# `runs_nothing` lists keys whose name looks like a program's but whose value git never runs from a
# folder's settings, each with why. Every key git documents whose last part names a program is in
# one of the two lists.
version: 1

keys:
  - key: core.fsmonitor
    runs: unless-boolean
    fires_on_its_own: true
  - key: core.hookspath
    runs: hooks-directory
  - key: core.editor
  - key: core.pager
    fires_on_its_own: true
  - key: core.sshcommand
  - key: core.askpass
  - key: core.gitproxy
    override: {environment: GIT_PROXY_COMMAND, value: ""}
  - key: sequence.editor
  - key: pager.*
    runs: unless-boolean
    fires_on_its_own: true
  - key: alias.*
    runs: after-bang
    bang: true
  - key: credential.helper
    bang: true
    override: {reset: credential.helper}
  - key: credential.*.helper
    bang: true
    override: {reset: credential.helper}
  - key: filter.*.clean
    driver: filter
    fires_on_its_own: true
  - key: filter.*.smudge
    driver: filter
    fires_on_its_own: true
  - key: filter.*.process
    driver: filter
    fires_on_its_own: true
  - key: diff.external
    fires_on_its_own: true
  - key: diff.*.command
    driver: diff
    fires_on_its_own: true
  - key: diff.*.textconv
    driver: diff
    fires_on_its_own: true
  - key: merge.*.driver
    driver: merge
    fires_on_its_own: true
  - key: mergetool.*.cmd
  - key: difftool.*.cmd
  - key: gpg.program
    fires_on_its_own: true
  - key: gpg.*.program
    fires_on_its_own: true
  - key: remote.*.uploadpack
    override: {setting: protocol.file.allow, value: never}
  - key: remote.*.receivepack
    override: {setting: protocol.file.allow, value: never}
  - key: submodule.*.update
    runs: after-bang
    bang: true
  - key: url.*.insteadof
    runs: ext-transport
    override: {setting: protocol.ext.allow, value: never}
  - key: url.*.pushinsteadof
    runs: ext-transport
    override: {setting: protocol.ext.allow, value: never}
  - key: protocol.ext.allow
    runs: enables-transport
    override: {setting: protocol.ext.allow, value: never}
  - key: gpg.ssh.defaultkeycommand
    fires_on_its_own: true
  - key: core.alternaterefscommand
    fires_on_its_own: true
  - key: interactive.difffilter
  - key: trailer.*.cmd
  - key: trailer.*.command
  - key: sendemail.sendmailcmd
  - key: sendemail.tocmd
  - key: sendemail.cccmd
  - key: browser.*.cmd
  - key: man.*.cmd
  - key: remote.*.url
    runs: ext-address
    fires_on_its_own: true
    override: {setting: protocol.ext.allow, value: never}
  - key: remote.*.pushurl
    runs: ext-address
    fires_on_its_own: true
    override: {setting: protocol.ext.allow, value: never}

  - key: lfs.customtransfer.*.path
    fires_on_its_own: true
  - key: lfs.extension.*.clean
    fires_on_its_own: true
  - key: lfs.extension.*.smudge
    fires_on_its_own: true
  - key: annex.*-command
    fires_on_its_own: true
  - key: hook.*.command
    fires_on_its_own: true
    override: {setting: "hook.{subsection}.enabled", value: "false"}
  - key: tar.*.command
  - key: difftool.*.path
  - key: mergetool.*.path
  - key: man.*.path
  - key: browser.*.path
  - key: guitool.*.cmd
  - key: imap.tunnel
  - key: instaweb.httpd
  - key: remote.*.vcs
  - key: sendemail.headercmd
  - key: sendemail.*.sendmailcmd
  - key: sendemail.*.tocmd
  - key: sendemail.*.cccmd
  - key: sendemail.*.headercmd
  - key: sendemail.smtpserver
    runs: absolute-path
  - key: sendemail.*.smtpserver
    runs: absolute-path
  - key: svn.authorsprog
  - key: gc.recentobjectshook
    override: {refuse: true}

always_set:
  - {key: protocol.file.allow, value: never, why: "a repository on this machine runs its own programs for git's local transport"}

runs_nothing:
  - {key: advice.*, why: "a message switch"}
  - {key: color.pager, why: "a colour switch"}
  - {key: column.clean, why: "a layout setting"}
  - {key: core.quotepath, why: "a display switch"}
  - {key: credential.usehttppath, why: "a switch"}
  - {key: diff.*.cachetextconv, why: "a switch"}
  - {key: rebase.reschedulefailedexec, why: "a switch"}
  - {key: fsck.gitmodulespath, why: "names a check"}
  - {key: receive.fsck.gitmodulespath, why: "names a check"}
  - {key: help.htmlpath, why: "names a folder git reads"}
  - {key: http.sslcapath, why: "names a folder git reads"}
  - {key: instaweb.modulepath, why: "names a folder git reads"}
  - {key: sendemail.smtpsslcertpath, why: "names a file git reads"}
  - {key: include.path, why: "names a settings file, whose settings are read as the folder's"}
  - {key: includeif.*.path, why: "names a settings file, whose settings are read as the folder's"}
  - {key: http.proxy, why: "names a proxy server"}
  - {key: remote.*.proxy, why: "names a proxy server"}
  - {key: gitcvs.dbdriver, why: "names a database driver"}
  - {key: uploadpack.packobjectshook, why: "git reads it only from your own settings"}
