# StayAwakeBot — Security sentinel configuration.
#
# Controls what gets scanned and how the security subtask behaves. The signature database ships
# inside the package; override it only with `signatures_path` below.
#
# Reference for every key: https://saw-docs.ndevuspace.com/reference/configuration/

settings:
  # Directories never traversed during scanning. Keep this list minimal.
  exclude_dirs: [".git", "node_modules", ".next", "dist", "build", ".saw", ".venv"]
  # Max file size (bytes) to read for content matching. Source files larger than this
  # are still scanned head+tail; only non-source assets are skipped.
  max_file_bytes: 2000000
  # Shallow-clone depth for remote targets.
  remote_clone_depth: 50
  # Opt-in: also scan build outputs (default false). Noisier by design.
  # scan_build_outputs: false
  # Optional: where the report bundle is written. Setting this IS the opt-in (no -d needed);
  # `-d DIR` overrides it for one run, as does STAYAWAKE_REPORTS_DIR. Unset by all three, a
  # scan writes nothing.
  # reports_dir: reports/security
  # Optional: path to a custom signature DB (default: the one packaged with stayawake).
  # signatures_path: config/my-signatures.yml

targets:
  # Local clone paths or globs (expanded with ~ and shell-style wildcards).
  local:
    - "~/dev/**"
  # GitHub accounts/orgs to enumerate and shallow-clone for scanning.
  # Requires a read-only token in env GITHUB_TOKEN (or GH_SECURITY_TOKEN).
  github:
    users: []          # e.g. [Ndevu12]
    orgs: []           # e.g. [UB-TechDEV]
    include_forks: false
    include_archived: false

# Findings to ignore. Each rule MUST name a `signature`, optionally scoped by `path_glob`;
# a bare `path_glob` is ignored.
#
# The rules below cover this repository's own test material and are scoped to it.
allowlist:
  - {signature: fake-font-fa-solid-400, path_glob: "tests/**"}
  - {signature: fake-font-text-woff, path_glob: "tests/**"}
  - {signature: camouflage-blockchain-readme, path_glob: "tests/**"}
  - {signature: vscode-allow-automatic-tasks, path_glob: "tests/**"}
  - {signature: vscode-task-folderopen-exec, path_glob: "tests/**"}
  - {signature: vscode-task-runs-font, path_glob: "tests/**"}
  - {signature: gitignore-autopush-markers, path_glob: "tests/**"}
  - {signature: loader-seed-var, path_glob: "tests/**"}
  - {signature: loader-decoder-fn, path_glob: "tests/**"}
  - {signature: loader-global-v-marker, path_glob: "tests/**"}
  - {signature: loader-fromcharcode-127, path_glob: "tests/**"}
  - {signature: loader-global-bang, path_glob: "tests/**"}
  - {signature: loader-require-hijack, path_glob: "tests/**"}
  - {signature: obfuscated-source-file, path_glob: "tests/**"}
  - {signature: oversized-config-line, path_glob: "tests/**"}
  - {signature: destructive-home-wipe, path_glob: "src/**"}
  - {signature: destructive-home-wipe, path_glob: "tests/**"}
  - {signature: secure-home-wipe, path_glob: "src/**"}
  - {signature: secure-home-wipe, path_glob: "tests/**"}
  - {signature: exfil-shai-hulud-branding, path_glob: "**/signatures.yml"}
  - {signature: exfil-shai-hulud-branding, path_glob: "tests/**"}
  - {signature: exfil-shai-hulud-branding, path_glob: "CHANGELOG.md"}
  - {signature: exfil-shai-hulud-token, path_glob: "src/**"}
  - {signature: exfil-shai-hulud-token, path_glob: "docs/**"}
  - {signature: exfil-shai-hulud-token, path_glob: "CHANGELOG.md"}
  - {signature: exfil-shai-hulud-token, path_glob: "README.md"}
  - {signature: exfil-shai-hulud-token, path_glob: "tests/**"}
  - {signature: exfil-shai-hulud-token, path_glob: "config/**"}
  - {signature: exfil-shai-hulud-token, path_glob: ".claude/**"}
  - {signature: npm-lifecycle-dropper, path_glob: "tests/**"}
  - {signature: npm-lifecycle-remote-fetch, path_glob: "tests/**"}
  - {signature: npm-lifecycle-exec, path_glob: "tests/**"}
  - {signature: loader-require-escapes-esm, path_glob: "tests/**"}
  - {signature: claude-hook-autorun, path_glob: "tests/**"}
  - {signature: claude-hook-runs-payload, path_glob: "tests/**"}
  - {signature: whitespace-concealment, path_glob: "tests/**"}

# Alerting. Channels read their secrets from env (SLACK_WEBHOOK_URL, GH_SECURITY_TOKEN).
alerts:
  slack: false
  github_issues: false
  # Minimum severity that triggers an alert.
  min_severity: "high"

# See config/urls.yml for the uptime sentinel configuration.
