# The layer of each crate, lowest first.

unsafe_allowed_in = "saw-platform"

[layer]
saw-model = 0
saw-platform = 1
saw-detect = 2
saw-engine = 3
saw-domains = 4
saw-act = 4
saw-present = 4
saw-cli = 5
saw-mcp = 5
saw-git-standin = 5

# The one place each capability may be used.
[home]
external_programs = "crates/saw-platform/src/programs"
network = "crates/saw-platform/src/network"
regex = "crates/saw-detect/src/patterns"
