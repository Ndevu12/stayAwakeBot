name: Build platform wheels (manual, publishes nothing)

# A dispatch-only check that saw's Rust binaries bundle into a platform wheel on each desktop OS.
# It builds the wheel, shows its tag and the bundled binaries, and uploads it as an artifact to
# download and inspect. It publishes nowhere and does not change the release pipeline. Linux
# (manylinux) is a deliberate follow-up: Linux users build the binaries from the sdist where a Rust
# toolchain is present, and a manylinux job is a larger piece to add to release.yml later.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  wheel:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x86_64
            os: macos-13
          - name: macOS arm64
            os: macos-14
          - name: Windows x86_64
            os: windows-latest
    steps:
      - name: Checkout (full history for hatch-vcs versioning)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version-file: .python-version
          check-latest: true

      - name: Build the platform wheel (the build hook compiles the Rust binaries)
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --wheel

      - name: Show the wheel tag and the bundled binaries
        shell: python
        run: |
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          bins = [n for n in names if "/bots/mcp/bin/" in n]
          print("wheel:", whl.rsplit("/", 1)[-1])
          print("bundled binaries:", bins)
          assert bins, "no binaries were bundled — the Rust toolchain was missing on this runner"

      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
