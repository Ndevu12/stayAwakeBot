name: Release — build, self-scan, publish (PyPI + GitHub Release)

# Supply-chain-hardened release pipeline. Given this project exists because of a
# self-propagating worm, the *release mechanism itself* must not become the next vector:
#   - tag-triggered only (a tag is an intentional, reviewable act)
#   - NO long-lived publish secret: PyPI upload uses Trusted Publishing (OIDC) + PEP 740
#     attestations, so there is no PYPI_API_TOKEN to steal
#   - the build job has no privileged permissions; publishing is isolated in its own job
#     with `id-token: write` and a protected GitHub Environment
#   - every third-party action is pinned to a full commit SHA (project doctrine)
#   - the release commit is re-scanned for worm indicators before anything is published
#
# Manual `workflow_dispatch` performs a TestPyPI dry-run (separate Trusted Publisher).
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

# Don't let two releases of the same ref race.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build & verify artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags for hatch-vcs versioning)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0

      # Fail the release BEFORE building/publishing if the tagged version was never cut into the
      # CHANGELOG. Stops the [Unreleased] drift that shipped v0.1.15/v0.1.16 unlisted (#1283). Tag
      # pushes only — a workflow_dispatch dry-run has no version tag to check.
      - name: Verify CHANGELOG was cut for this release
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 .github/scripts/check_changelog_release.py "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: true

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip
          pip install build "twine>=6.1"
          python -m build

      - name: Validate metadata (modern twine — rejects malformed 2.4 metadata)
        run: python -m twine check --strict dist/*

      - name: Smoke-test the built wheel (entry points + packaged signature DB)
        run: |
          pip install dist/*.whl
          saw --help
          saw scan --help
          stayawake-health-check --help

      - name: Resolve app dependencies in a clean venv (for audit + SBOM)
        run: |
          python -m venv /tmp/appenv
          /tmp/appenv/bin/pip install --quiet --upgrade pip
          /tmp/appenv/bin/pip install dist/*.whl
          # Audit/SBOM the app's RESOLVED dependency set; drop our own dist (not on PyPI yet).
          # `--exclude` matches by name, so it drops the project whether `pip freeze` emits it
          # as `stayawakebot==X` or, for a wheel installed by path, `stayawakebot @ file://…`.
          /tmp/appenv/bin/pip freeze --exclude stayawakebot > /tmp/app-requirements.txt

      - name: Audit dependencies for known vulnerabilities (gate)
        run: |
          pip install pip-audit
          # Fails the release on any advisory in the resolved deps. To ship past a vuln with
          # no fix yet, add a scoped `--ignore-vuln GHSA-xxxx` here.
          pip-audit --strict --requirement /tmp/app-requirements.txt

      - name: Generate CycloneDX SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment /tmp/appenv/bin/python --of JSON -o sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  self-scan:
    name: Self-scan release commit for worm indicators
    runs-on: ubuntu-latest
    permissions:
      contents: read   # pure exit-code publish gate; no SARIF upload here (owned by security-sentinel)
    steps:
      - name: Checkout (full history for evil-merge detection)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
      - name: Worm scan
        uses: ./.github/actions/worm-scan
        with:
          # Pin the scanner to a known-good SHA, NEVER the commit under test: a compromised
          # release commit must not be able to certify itself. Bump after an intentional
          # scanner/signature update (kept in sync with worm-guard.yml).
          sentinel-ref: 57b77dc74d9fe87b8d6183b3e97d142970e46425   # current main — kept identical to worm-guard.yml (enforced by pin_tools.py synced)
          fail-on-findings: 'true'
          # Pure exit-code gate: the job conclusion is the scan verdict, nothing else. This
          # commit is also scanned (and, when enabled, uploaded) by worm-guard + security-sentinel,
          # so a redundant code-scanning copy here is dropped.
          upload-sarif: 'false'
          # SINGLE SOURCE OF TRUTH: same committed, CODEOWNERS-guarded config/security.yml as
          # worm-guard.yml — no hand-copied allowlist to drift out of sync between the two gates.
          config-file: config/security.yml

  publish-testpypi:
    name: Publish to TestPyPI (manual dry-run)
    if: github.event_name == 'workflow_dispatch'
    needs: [build, self-scan]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write          # OIDC for Trusted Publishing — no API token
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33   # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
          # TestPyPI forbids re-uploading an existing version; a dispatch dry-run of a
          # version already there (e.g. one bootstrapped manually) should no-op, not fail.
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, self-scan]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # OIDC for Trusted Publishing — no API token
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33   # v1.14.2
        with:
          attestations: true   # PEP 740 signed provenance, displayed on the PyPI page
          # A re-run of a tag whose files already published should no-op, not hard-fail.
          # (New versions still come from a new tag — PyPI rejects changed re-uploads.)
          skip-existing: true

  github-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the release + upload assets
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
        with:
          name: sbom
          path: sbom/
      - name: Create release with auto-generated notes + artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: if the release was pre-created (e.g. by hand) the create call would
          # fail with "release already exists", so upload the artifacts to the existing
          # release instead. A fresh run still creates it with generated notes.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists — uploading artifacts to it."
            gh release upload "${GITHUB_REF_NAME}" dist/* sbom/sbom.cdx.json --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* sbom/sbom.cdx.json \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi

  docker:
    name: Build & publish container (GHCR)
    # Same gate as the package: only after the worm self-scan passes — the image must not ship
    # from a release commit the scanner would reject. Independent of the PyPI job (the image
    # builds the wheel from source), so it runs in parallel.
    #
    # Runs on a manual dispatch too, but only as far as building and scanning: the base image is
    # digest-pinned, so a newly-fixed CVE in it fails the vulnerability gate at release time —
    # after the tag exists and the version is spent. A dispatch exercises that gate first. The
    # push step stays tag-only.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build, self-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to GHCR via the built-in GITHUB_TOKEN — no extra secret
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Derive version from tag (v0.1.0 -> 0.1.0)
        # A dispatch has no version tag; the value only labels the locally-loaded scan image.
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # Must be a valid PEP 440 version — it is passed to the build as
            # SETUPTOOLS_SCM_PRETEND_VERSION, so a non-version string fails the wheel build
            # inside the image — and a legal Docker tag, so no local-version '+' segment.
            echo "VERSION=0.0.0.dev0" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e   # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f   # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags + OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302   # v6.2.0
        with:
          images: ghcr.io/ndevu12/stayawakebot      # GHCR requires a lowercase path
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest

      # Build the image locally first and gate it on a vulnerability scan BEFORE publishing,
      # so a fixable critical/high never reaches GHCR (no "published-but-failed"). The push
      # step below reuses this build from the buildx cache.
      - name: Build image for scanning (load locally, no push yet)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a   # v7.3.0
        with:
          context: .
          build-args: VERSION=${{ env.VERSION }}
          load: true
          tags: ghcr.io/ndevu12/stayawakebot:${{ env.VERSION }}

      # Two steps: `format: sarif` rebuilds the report at ALL severities, discarding `severity`, so
      # one sarif step with exit-code 1 gates on any finding (0.5.2: blocked by 18 MEDIUM, 0 HIGH).
      - name: Vulnerability gate (Trivy) — block on FIXABLE critical/high
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          image-ref: ghcr.io/ndevu12/stayawakebot:${{ env.VERSION }}
          format: table          # NOT sarif — sarif is what discards the severity filter
          severity: CRITICAL,HIGH
          ignore-unfixed: true   # don't block on CVEs with no upstream fix available yet
          exit-code: '1'         # a fixable critical/high fails the job before anything is pushed

      - name: Vulnerability report (Trivy SARIF, all severities — never blocks)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          image-ref: ghcr.io/ndevu12/stayawakebot:${{ env.VERSION }}
          format: sarif
          output: trivy.sarif
          exit-code: '0'

      - name: Upload Trivy SARIF
        if: always()             # keep the scan record even when the gate fails
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: trivy-sarif
          path: trivy.sarif
          if-no-files-found: warn

      - name: Build & push (with SLSA provenance + SBOM attestations)
        if: startsWith(github.ref, 'refs/tags/v')   # never push from a dry run
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a   # v7.3.0
        with:
          context: .
          build-args: VERSION=${{ env.VERSION }}
          push: true             # reuses the cached build above
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true       # SLSA provenance attestation pushed to GHCR
          sbom: true             # SBOM attestation pushed to GHCR
