name: Docs — build & publish

# Builds the MkDocs Material site and publishes it to GitHub Pages.
#
# `saw` ships PINNED releases, so an unversioned site would misdescribe every older install.
# `mike` therefore keeps one directory per version on the `gh-pages` branch:
#   * a push to `main`  -> version `latest` (the default alias; what a bare docs URL resolves to)
#   * a published release -> an immutable version directory named after the tag (e.g. `0.6.1`)
# Pages itself is served from the uploaded ARTIFACT (Settings -> Pages -> Source: GitHub Actions),
# not from the branch; `gh-pages` is only mike's version store.
#
# A pull request runs `mkdocs build --strict` and stops there — no branch write, no deploy. Strict
# mode turns a broken relative link, a dangling #anchor, or a page missing from the nav into a
# build failure, so a docs regression cannot merge.
#
# Every action is pinned to a commit SHA with the tag in a trailing comment (#1453): a moving tag
# is a supply-chain hole, and this repo does not get to enforce SHA pinning on its users while
# floating its own.

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  release:
    types: [published]
  # Publish a version by hand — for backfilling a release that predates this site, or re-cutting
  # one. Leave `version` empty to refresh `latest` exactly as a push to main does.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.6.2). Empty refreshes `latest`.'
        required: false
        default: ''
      set_latest:
        description: 'Also point the `latest` alias at it'
        type: boolean
        required: false
        default: false

# Least privilege at the top: read-only. Each job widens ONLY what it needs.
permissions:
  contents: read

concurrency:
  # PR runs supersede each other; publishing runs queue, because two mike runs racing on
  # `gh-pages` would lose a version.
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The gate. Runs on every trigger, including pull requests.
  build:
    name: Build (strict)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: requirements-docs.txt

      - name: Install the docs toolchain
        run: pip install -r requirements-docs.txt

      - name: mkdocs build --strict
        run: mkdocs build --strict

      # Build it the way mike deploys it, and assert the link-preview image resolves. mike rewrites
      # site_url to ".../latest" with no trailing slash; a template that concatenates rather than
      # joins produced "/latestassets/og-card.png" — a 404 that a plain build never reproduces,
      # because there the trailing slash is still present.
      - name: Card and canonical survive a versioned build
        run: |
          set -euo pipefail
          MIKE_DOCS_VERSION=latest mkdocs build --strict -d /tmp/site-versioned
          img=$(grep -om1 '<meta property="og:image" content="[^"]*"' /tmp/site-versioned/index.html)
          echo "$img"
          case "$img" in
            *"/latest/assets/og-card.png"*) echo "og:image OK" ;;
            *) echo "::error::og:image does not resolve under a versioned deploy: $img"; exit 1 ;;
          esac
          test -f /tmp/site-versioned/assets/og-card.png
          site_url=$(python -c "import mkdocs.utils.yaml as y; print(y.yaml_load(open('mkdocs.yml'))['site_url'])")
          grep -q "<link rel=\"canonical\" href=\"${site_url%/}/latest/" \
            /tmp/site-versioned/reference/cli/scan/index.html \
            || { echo "::error::canonical is not the versioned URL"; exit 1; }

  # Writes the version to `gh-pages` and hands the whole versioned tree to Pages.
  publish:
    name: Publish version
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # mike commits the built version to the `gh-pages` branch
      pages: read
    steps:
      - name: Checkout (full history — mike needs the gh-pages branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: requirements-docs.txt

      - name: Install the docs toolchain
        run: pip install -r requirements-docs.txt

      - name: Configure the committer
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # A release publishes its own immutable version directory, named after the tag with the
      # leading `v` stripped, and leaves `latest` alone — someone on a pinned 0.6.1 keeps a page
      # that describes 0.6.1. Everything else publishes/refreshes `latest`.
      - name: Deploy this version with mike
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SET_LATEST: ${{ inputs.set_latest }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "release" ]; then
            version="${TAG#v}"
            [ -n "$version" ] || { echo "::error::release event with an empty tag_name"; exit 1; }
            mike deploy --push "$version"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ -n "${INPUT_VERSION}" ]; then
            # A hand-published version: same immutable directory a release would create, so a
            # release that predates this site can be backfilled without re-tagging it.
            case "$INPUT_VERSION" in
              [0-9]*.[0-9]*.[0-9]*) : ;;
              *) echo "::error::version must look like 1.2.3 (no leading v); got '$INPUT_VERSION'"; exit 1 ;;
            esac
            if [ "$INPUT_SET_LATEST" = "true" ]; then
              mike deploy --push --update-aliases "$INPUT_VERSION" latest
            else
              mike deploy --push "$INPUT_VERSION"
            fi
          else
            mike deploy --push --update-aliases latest
            mike set-default --push latest
          fi
          mike list

      # Serve the ENTIRE versioned tree, not just this build, so the version selector and every
      # older version stay reachable. `git archive` gives a clean tree with no .git in it.
      - name: Materialise the gh-pages tree for Pages
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          mkdir -p pages-artifact
          git archive origin/gh-pages | tar -x -C pages-artifact
          test -s pages-artifact/index.html   # fail loudly rather than deploying an empty site

      # The custom domain and the crawl directives have to sit at the SITE ROOT, and mike deploys
      # each build into a version subdirectory — so neither can come from `docs/`, which lands in
      # `latest/`. They are written here instead, once, over the whole versioned tree.
      #
      # CNAME: Pages stores the custom domain in repository settings for an Actions deployment, but
      # shipping the file too is what keeps the domain from being dropped by a later deploy.
      - name: Write the site-root files (custom domain, crawl directives)
        run: |
          set -euo pipefail
          # The domain is written once, in mkdocs.yml. Derive it here rather than repeating it.
          site_url=$(python -c "import mkdocs.utils.yaml as y; print(y.yaml_load(open('mkdocs.yml'))['site_url'])")
          host=$(python -c "import urllib.parse; print(urllib.parse.urlparse('$site_url').netloc)")
          [ -n "$host" ] || { echo "::error::could not read site_url from mkdocs.yml"; exit 1; }
          echo "site_url=$site_url  host=$host"
          echo "$host" > pages-artifact/CNAME

          # A sitemap may only list URLs at or below its OWN location, so the per-version
          # `latest/sitemap.xml` can never speak for the whole host. This index sits at the root and
          # points at it, which is what robots.txt advertises.
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' \
            "  <sitemap><loc>https://$host/latest/sitemap.xml</loc></sitemap>" \
            '</sitemapindex>' > pages-artifact/sitemap.xml

          printf '%s\n' 'User-agent: *' 'Allow: /' '' \
            "Sitemap: https://$host/sitemap.xml" > pages-artifact/robots.txt

          # Prove the sitemap the index points at exists AND names this host — a sitemap listing
          # another host is rejected wholesale, which is exactly how the first deploy failed.
          test -s pages-artifact/latest/sitemap.xml \
            || { echo "::error::latest/sitemap.xml missing"; exit 1; }
          if grep -q "<loc>https://$host/" pages-artifact/latest/sitemap.xml; then
            echo "sitemap host OK"
          else
            echo "::error::latest/sitemap.xml does not name $host — Google will reject every URL"
            grep -o '<loc>https://[^/]*' pages-artifact/latest/sitemap.xml | sort -u
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d   # v6.0.0

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: pages-artifact

  deploy:
    name: Deploy to Pages
    if: github.event_name != 'pull_request'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write        # publish the uploaded artifact
      id-token: write     # OIDC verification of the deployment's origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128   # v5.0.0
