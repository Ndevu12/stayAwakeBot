name: StayAwakeBot Sentinel — URL Availability Check (sentinel subtask)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      config_path:
        description: 'Path to config file'
        required: false
        default: 'config/urls.yml'
  push:
    branches: [main]
    paths:
      - 'config/urls.yml'

permissions:
  contents: read     # the sentinel commits NOTHING — status lives in ONE self-updating issue (#1149)
  issues: write      # find-or-update the single 'Availability status' dashboard issue

# One run at a time so two overlapping cron ticks can't race the issue update (save() self-heals
# any duplicate anyway; this just avoids the churn).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  availability-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7.0.0

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Check availability + refresh the status issue
        # One command: check every URL, fold the result into the single dashboard issue (the whole
        # store — debounce + incidents live in its hidden state block), then Slack on transitions.
        # No report files, no commits.
        #
        # Deliberately WITHOUT --fail-on-unhealthy. A monitored endpoint being down is the result
        # this job exists to report, not a failure of the job: reddening the run makes "the service
        # is down" indistinguishable from "the monitor is broken", and trains the tab to be ignored.
        # The run fails only when the check itself cannot be performed.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: stayawake-health-check --config config/urls.yml
